services:
  - type: web
    name: leavesdesign-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python generate_dashboard.py --serve
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.12.0
      # Optional: set these in Render dashboard (not here!) to enable password protection
      # - key: DASH_USER
      #   value: your-username
      # - key: DASH_PASS
      #   value: your-password
